<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Clothing Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="app-container">
        <div class="app-layout">
            <!-- Sidebar Categories -->
            <div class="sidebar-nav">
                <nav id="categories-nav">
                </nav>
            </div>

            <!-- Main Content -->
            <div class="content-wrapper">
                <!-- Header -->
                <div class="content-header">
                    <div class="products-count">6 ITEMS</div>
                    <div class="products-sort">
                        <span>SORT BY</span>
                        <button class="sort-button">
                            RECOMMENDED
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="m6 9 6 6 6-6" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Product Grid -->
                <div class="products-grid">
                    <!-- Product 1 -->
                    <div class="product-item">
                        <div class="product-image-container">
                            <img src="./assets/Product image.png" alt="Slub Jersey T-Shirt" class="product-img">
                        </div>
                        <h3 class="product-name">SLUB JERSEY T-SHIRT</h3>
                        <p class="product-price">$ 12.99</p>
                        <button class="product-add-button">Add to bag</button>
                    </div>

                    <!-- Product 2 -->
                    <div class="product-item">
                        <div class="product-image-container">
                            <img src="./assets/Product image (1).png" alt="Printed T-Shirt" class="product-img">
                        </div>
                        <h3 class="product-name">PRINTED T-SHIRT</h3>
                        <p class="product-price">$ 12.99</p>
                        <button class="product-add-button">Add to bag</button>
                    </div>

                    <!-- Product 3 -->
                    <div class="product-item">
                        <div class="product-image-container">
                            <img src="./assets/Product image (2).png" alt="Cotton T-Shirt" class="product-img">
                        </div>
                        <h3 class="product-name">COTTON T-SHIRT</h3>
                        <p class="product-price">$ 12.99</p>
                        <button class="product-add-button">Add to bag</button>
                    </div>

                    <!-- Product 4 -->
                    <div class="product-item">
                        <div class="product-image-container">
                            <img src="./assets/Product image (3).png" alt="T-Shirt with a Motif" class="product-img">
                        </div>
                        <h3 class="product-name">T-SHIRT WITH A MOTIF</h3>
                        <p class="product-price">$ 12.99</p>
                        <button class="product-add-button">Add to bag</button>
                    </div>

                    <!-- Product 5 -->
                    <div class="product-item">
                        <div class="product-image-container">
                            <img src="./assets/Product image (4).png" alt="Cotton T-Shirt Regular Fit" class="product-img">
                        </div>
                        <h3 class="product-name">COTTON T-SHIRT REGULAR FIT</h3>
                        <p class="product-price">$ 12.99</p>
                        <button class="product-add-button">Add to bag</button>
                    </div>

                    <!-- Product 6 -->
                    <div class="product-item">
                        <div class="product-image-container">
                            <img src="./assets/Product image (5).png" alt="Slub Jersey T-Shirt" class="product-img">
                        </div>
                        <h3 class="product-name">SLUB JERSEY T-SHIRT</h3>
                        <p class="product-price">$ 12.99</p>
                        <button class="product-add-button">Add to bag</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./main.js"></script>
</body>

</html>
